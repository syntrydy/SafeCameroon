name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safecameroon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/safecameroon_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo test --workspace -- --ignored --test-threads=1

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run lint

  citizen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/citizen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/citizen/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run lint

  # Deploys all four Railway services once every check above has passed.
  # Only runs for a push to main (a merged PR), never for a pull_request
  # event -- CI still runs and must pass on every PR, but nothing deploys
  # until that PR is actually merged. Requires a RAILWAY_TOKEN repository
  # secret (a project-scoped token created via the Railway dashboard,
  # Project Settings -> Tokens -- Railway does not support minting one
  # through the CLI or API). Deploys the already-built artifacts only; a
  # database migration is still a separate, manual `sqlx migrate run`
  # step (docs/DEPLOYMENT.md) -- auto-deploy does not auto-migrate.
  deploy:
    runs-on: ubuntu-latest
    needs: [rust, console, citizen]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 82278915-ac8b-4646-8826-358dd65b7d4f
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @railway/cli
      - name: Deploy api
        timeout-minutes: 10
        run: railway up --service api --environment production --project "$RAILWAY_PROJECT_ID" --ci
      - name: Deploy worker
        timeout-minutes: 10
        run: railway up --service worker --environment production --project "$RAILWAY_PROJECT_ID" --ci
      - name: Deploy console
        timeout-minutes: 10
        run: railway up --service console --environment production --project "$RAILWAY_PROJECT_ID" --ci
      - name: Deploy citizen
        timeout-minutes: 10
        run: railway up --service citizen --environment production --project "$RAILWAY_PROJECT_ID" --ci
