[workspace]
members = [
    "crates/domain",
    "crates/application",
    "apps/api",
    "apps/worker",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
