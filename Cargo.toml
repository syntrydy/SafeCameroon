[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "apps/api",
    "apps/worker",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
argon2 = "0.5"
async-trait = "0.1"
aws-credential-types = "1"
# Pinned exactly: 1.4+ raises its own MSRV above this workspace's
# rust-version (1.85); 1.3.6 is the newest release that still satisfies it.
aws-sigv4 = "=1.3.6"
axum = "0.8"
dotenvy = "0.15"
hmac = "0.12"
http = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
