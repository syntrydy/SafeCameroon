[workspace]
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "apps/api",
    "apps/worker",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1"
aws-credential-types = "1"
base64 = "0.22"
# Pinned exactly: 1.4+ raises its own MSRV above this workspace's
# rust-version (1.85); 1.3.6 is the newest release that still satisfies it.
aws-sigv4 = "=1.3.6"
axum = "0.8"
dotenvy = "0.15"
hmac = "0.12"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# default-features = false: skip the bundled isahc/hyper HTTP clients (the
# crate's `clients::request_builder` module is designed to be consumed by
# any client) so Web Push sends reuse this workspace's existing reqwest
# client instead of adding a second HTTP stack.
web-push = { version = "0.11", default-features = false }
